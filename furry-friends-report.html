  <script type="text/babel">
    const { useState, useEffect } = React;

    // Utility to format large numbers
    const formatNumber = (num) => {
      if (isNaN(num) || num === null) return '0';
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return num.toFixed(0);
    };

    // Utility to parse dates safely
    const maybeDate = (date) => (date instanceof Date ? date : chrono.parseDate(date));

    const App = () => {
      const [data, setData] = useState([]);
      const [loading, setLoading] = useState(true);

      // Load and process CSV data
      useEffect(() => {
        const csv = loadFileData("Fury_Friends data set_4376 (1).xlsx");
        Papa.parse(csv, {
          header: true,
          skipEmptyLines: true,
          dynamicTyping: false,
          transformHeader: (header) => header.trim().replace(/^"|"$/g, ''),
          transform: (value, header) => {
            let cleaned = value.trim().replace(/^"|"$/g, '');
            if (['Units Sld', 'Revenue', 'Cost', 'Profit'].includes(header)) {
              return cleaned === '' ? 0 : parseFloat(cleaned) || 0;
            }
            if (header === 'Date') {
              return maybeDate(cleaned)?.toISOString().split('T')[0] || cleaned;
            }
            return cleaned === '' ? 'Unknown' : cleaned;
          },
          complete: (results) => {
            const cleanedData = results.data.map(row => ({
              ...row,
              Pet: row["Pet"] === 'Hampster' ? 'Hamster' : row["Pet"],
              ProfitMargin: row["Revenue"] > 0 ? (row["Profit"] / row["Revenue"] * 100).toFixed(2) : 0,
              Store: `${row["Managers First Name"]} ${row["Managers Surname"]} (${row["Area"]})`,
              Month: new Date(row["Date"]).toLocaleString('default', { month: 'short', year: 'numeric' })
            })).filter(row => row["Profit"] !== null && !isNaN(row["Profit"]));
            setData(cleanedData);
            setLoading(false);
          },
          error: (err) => {
            console.error(err);
            setLoading(false);
          }
        });
      }, []);

      if (loading) {
        return (
          <div className="flex justify-center items-center h-screen">
            <p className="text-xl">Loading...</p>
          </div>
        );
      }

      // Aggregate data for visualizations
      const profitByArea = {};
      const profitByPet = {};
      const profitByAreaPet = {};
      const profitByMonth = {};
      const profitByStore = {};

      data.forEach(row => {
        const area = row["Area"];
        const pet = row["Pet"];
        const profit = row["Profit"];
        const month = row["Month"];
        const store = row["Store"];

        profitByArea[area] = (profitByArea[area] || 0) + profit;
        profitByPet[pet] = (profitByPet[pet] || 0) + profit;
        profitByAreaPet[`${area}_${pet}`] = (profitByAreaPet[`${area}_${pet}`] || 0) + profit;
        profitByMonth[month] = (profitByMonth[month] || 0) + profit;
        profitByStore[store] = (profitByStore[store] || 0) + profit;
      });

      const areaData = Object.entries(profitByArea).map(([area, profit]) => ({ area, profit }));
      const petData = Object.entries(profitByPet).map(([pet, profit]) => ({ pet, profit }));
      const areaPetData = Object.entries(profitByAreaPet).map(([key, profit]) => {
        const [area, pet] = key.split('_');
        return { area, pet, profit };
      });
      const monthData = Object.entries(profitByMonth).map(([month, profit]) => ({ month, profit }));
      const storeData = Object.entries(profitByStore).map(([store, profit]) => ({ store, profit }));

      // Interesting Fact
      const topPet = petData.reduce((max, curr) => curr.profit > max.profit ? curr : max, petData[0]);
      const interestingFact = `Did you know? ${topPet.pet} sales generated the highest profit at £${formatNumber(topPet.profit)}, highlighting their popularity!`;

      return (

          <div className="bg-white p-4 rounded shadow mb-6">
            <h2 className="text-xl font-semibold mb-2">Summary</h2>
            <p>This report analyzes sales data for Furry Friends, covering profits by area, pet type, and over time. Key insights include regional performance, popular pets, and cost-profit relationships.</p>
            <p className="mt-2 italic">{interestingFact}</p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div className="bg-white p-4 rounded shadow">
              <h2 className="text-lg font-semibold mb-2">Total Profit by Area</h2>
              <Recharts.ResponsiveContainer width="100%" height={300}>
                <Recharts.BarChart data={areaData}>
                  <Recharts.CartesianGrid strokeDasharray="3 3" />
                  <Recharts.XAxis dataKey="area" label={{ value: 'Store Location', position: 'insideBottom', offset: -5, fontSize: 12 }} />
                  <Recharts.YAxis label={{ value: 'Total Profit (£)', angle: -90, position: 'insideLeft', fontSize: 12 }} tickFormatter={formatNumber} />
                  <Recharts.Tooltip formatter={(value) => `£${formatNumber(value)}`} />
                  <Recharts.Legend />
                  <Recharts.Bar dataKey="profit" fill="#8884d8" />
                </Recharts.BarChart>
              </Recharts.ResponsiveContainer>
            </div>

            <div className="bg-white p-4 rounded shadow">
              <h2 className="text-lg font-semibold mb-2">Total Profit by Pet Type</h2>
              <Recharts.ResponsiveContainer width="100%" height={300}>
                <Recharts.BarChart data={petData}>
                  <Recharts.CartesianGrid strokeDasharray="3 3" />
                  <Recharts.XAxis dataKey="pet" label={{ value: 'Pet Type', position: 'insideBottom', offset: -5, fontSize: 12 }} />
                  <Recharts.YAxis label={{ value: 'Total Profit (£)', angle: -90, position: 'insideLeft', fontSize: 12 }} tickFormatter={formatNumber} />
                  <Recharts.Tooltip formatter={(value) => `£${formatNumber(value)}`} />
                  <Recharts.Legend />
                  <Recharts.Bar dataKey="profit" fill="#008080" />
                </Recharts.BarChart>

                  <Recharts.Bar dataKey="profit" stackId="a">
                    {petData.map((pet, index) => (
                      <Recharts.Cell key={pet.pet} fill={['#8884d8', '#82ca9d', '#ffc107', '#ff5722', '#ab47bc', '#26a69a'][index % 6]} />
                    ))}
                  </Recharts.Bar>
                </Recharts.BarChart>
              </Recharts.ResponsiveContainer>
            </div>

            <div className="bg-white p-4 rounded shadow">
              <h2 className="text-lg font-semibold mb-2">Profit Over Time</h2>
              <Recharts.ResponsiveContainer width="100%" height={300}>
                <Recharts.LineChart data={monthData}>
                  <Recharts.CartesianGrid strokeDasharray="3 3" />
                  <Recharts.XAxis dataKey="month" label={{ value: 'Month', position: 'insideBottom', offset: -5, fontSize: 12 }} />
                  <Recharts.YAxis label={{ value: 'Total Profit (£)', angle: -90, position: 'insideLeft', fontSize: 12 }} tickFormatter={formatNumber} />
                  <Recharts.Tooltip formatter={(value) => `£${formatNumber(value)}`} />
                  <Recharts.Legend />
                  <Recharts.Line type="monotone" dataKey="profit" stroke="#8884d8" />
                </Recharts.LineChart>
              </Recharts.ResponsiveContainer>
            </div>

            <div className="bg-white p-4 rounded shadow">
              <h2 className="text-lg font-semibold mb-2">Cost vs. Profit by Area</h2>
              <Recharts.ResponsiveContainer width="100%" height={300}>
                <Recharts.ScatterChart>
                  <Recharts.CartesianGrid strokeDasharray="3 3" />
                  <Recharts.XAxis dataKey="Cost" label={{ value: 'Cost (£)', position: 'insideBottom', offset: -5, fontSize: 12 }} tickFormatter={formatNumber} />
                  <Recharts.YAxis dataKey="Profit" label={{ value: 'Profit (£)', angle: -90, position: 'insideLeft', fontSize: 12 }} tickFormatter={formatNumber} />
                  <Recharts.Tooltip formatter={(value) => `£${formatNumber(value)}`} />
                  <Recharts.Legend />
                  {areaData.map((area, index) => (
                    <Recharts.Scatter
                      key={area.area}
                      name={area.area}
                      data={data.filter(row => row["Area"] === area.area).map(row => ({ Cost: row["Cost"], Profit: row["Profit"] }))}
                      fill={['#8884d8', '#82ca9d', '#ffc107', '#ff5722', '#ab47bc'][index % 5]}
                    />
                  ))}
                </Recharts.ScatterChart>
              </Recharts.ResponsiveContainer>
            </div>

            <div className="bg-white p-4 rounded shadow md:col-span-2">
              <h2 className="text-lg font-semibold mb-2">Average Profit Margin by Area</h2>
              <Recharts.ResponsiveContainer width="100%" height={300}>
                <Recharts.BarChart data={areaData.map(area => ({
                  area: area.area,
                  profitMargin: data.filter(row => row["Area"] === area.area).reduce((sum, row) => sum + parseFloat(row["ProfitMargin"]), 0) / data.filter(row => row["Area"] === area.area).length
                }))}>
                  <Recharts.CartesianGrid strokeDasharray="3 3" />
                  <Recharts.XAxis dataKey="area" label={{ value: 'Store Location', position: 'insideBottom', offset: -5, fontSize: 12 }} />
                  <Recharts.YAxis label={{ value: 'Profit Margin (%)', angle: -90, position: 'insideLeft', fontSize: 12 }} />
                  <Recharts.Tooltip formatter={(value) => `${value.toFixed(2)}%`} />
                  <Recharts.Legend />
                  <Recharts.Bar dataKey="profitMargin" fill="#4caf50" />
                </Recharts.BarChart>
              </Recharts.ResponsiveContainer>
            </div>

            <div className="bg-white p-4 rounded shadow md:col-span-2">
              <h2 className="text-lg font-semibold mb-2">Total Profit by Store</h2>
              <Recharts.ResponsiveContainer width="100%" height={400}>
                <Recharts.BarChart data={storeData}>
                  <Recharts.CartesianGrid strokeDasharray="3 3" />
                  <Recharts.XAxis dataKey="store" label={{ value: 'Store (Manager & Area)', position: 'insideBottom', offset: -5, fontSize: 12 }} angle={45} textAnchor="end" />
                  <Recharts.YAxis label={{ value: 'Total Profit (£)', angle: -90, position: 'insideLeft', fontSize: 12 }} tickFormatter={formatNumber} />
                  <Recharts.Tooltip formatter={(value) => `£${formatNumber(value)}`} />
                  <Recharts.Legend />
                  <Recharts.Bar dataKey="profit" fill="#ff9800" />
                </Recharts.BarChart>
              </Recharts.ResponsiveContainer>
            </div>
          </div>

          <div className="bg-white p-4 rounded shadow mt-6">
            <h2 className="text-xl font-semibold mb-2">Conclusion</h2>
            <p>The Furry Friends sales data reveals strong regional and pet-specific performance trends. Areas like Dudley and Manchester show high profits, while pets like Dogs and Cats dominate sales. Monitoring cost-profit relationships and seasonal trends can further optimize performance.</p>
          </div>

          <div className="bg-white p-4 rounded shadow mt-6">
            <h2 className="text-xl font-semibold mb-2">Data Table</h2>
            <div className="overflow-x-auto">
              <table className="min-w-full bg-white">
                <thead>
                  <tr>
                    <th className="py-2 px-4 border-b">Manager</th>
                    <th className="py-2 px-4 border-b">Area</th>
                    <th className="py-2 px-4 border-b">Pet</th>
                    <th className="py-2 px-4 border-b">Units Sold</th>
                    <th className="py-2 px-4 border-b">Revenue (£)</th>
                    <th className="py-2 px-4 border-b">Cost (£)</th>
                    <th className="py-2 px-4 border-b">Profit (£)</th>
                    <th className="py-2 px-4 border-b">Profit Margin (%)</th>
                    <th className="py-2 px-4 border-b">Date</th>
                  </tr>
                </thead>
                <tbody>
                  {data.slice(0, 10).map((row, index) => (
                    <tr key={index}>
                      <td className="py-2 px-4 border-b">{row["Store"]}</td>
                      <td className="py-2 px-4 border-b">{row["Area"]}</td>
                      <td className="py-2 px-4 border-b">{row["Pet"]}</td>
                      <td className="py-2 px-4 border-b">{row["Units Sld"]}</td>
                      <td className="py-2 px-4 border-b">{formatNumber(row["Revenue"])}</td>
                      <td className="py-2 px-4 border-b">{formatNumber(row["Cost"])}</td>
                      <td className="py-2 px-4 border-b">{formatNumber(row["Profit"])}</td>
                      <td className="py-2 px-4 border-b">{row["ProfitMargin"]}</td>
                      <td className="py-2 px-4 border-b">{row["Date"]}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <p className="mt-2 text-sm">Showing first 10 rows for brevity.</p>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
